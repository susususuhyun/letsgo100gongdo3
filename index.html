              eng: "Hi. My name is Homin. This is me in front of the wall painting. The wings are so pretty, aren't they? Many people like to take pictures in front of wall paintings. They make old neighborhoods bright and new.", 
              kor: "안녕하세요. 제 이름은 호민입니다. 이것은 벽화 앞에 있는 저입니다. 날개가 아주 귀엽죠, 그렇지 않나요? 많은 사람들이 벽화 앞에서 사진을 찍는 것을 좋아합니다. 그것들은 낡은 동네를 밝고 새롭게 만듭니다.", 
              tip: "<b>aren't they?</b>: 부가의문문 수일치 타겟팅. <b>make + 목적어 + 형용사 목적격보어</b> 원칙으로 부사 오답 스크리닝." },
            { svg: `<svg viewBox="0 0 400 150" class="w-full h-full"><rect width="100%" height="100%" fill="#064e3b"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#a7f3d0" font-size="14" font-weight="bold">MAIN 3-M2: Volunteer Wall Painting Group</text></svg>`,
              eng: "The day of the project finally came. The project manager had us meet at the painting site at 9 a.m. The wall was in very poor condition. There were strange writing and drawings on some parts. Other parts had old posters on them. We removed the posters first and painted over the writings and drawings with white paint. The manager let us paint anything (that) we wanted. We decided to paint something cute because the wall was near an elementary school.", 
              kor: "프로젝트의 날이 마침내 왔습니다. 프로젝트 매니저는 우리를 오전 9시에 그릴 장소에서 만나도록 했습니다. 벽은 매우 형편없는 상태였습니다. 어떤 부분들에는 이상한 글과 그림이 있었습니다. 다른 부분들은 그것들 위에 오래된 포스터가 있었습니다. 우리는 먼저 포스터들을 제거했습니다. 그리고 글과 그림을 흰색 페인트로 덧칠했습니다. 매니저가 우리에게 우리가 원하는 어떤 것이든 그리도록 허락했습니다. 우리는 그 벽이 초등학교 근처에 있었기 때문에 귀여운 어떤 것을 그리기 결정했습니다.", 
              tip: "<b>had us meet</b>: 사역동사 목적격 원형 보어 매칭. <b>something cute</b>: -thing 대명사 수식은 반드시 형용사가 후치 배치됨." },
            { svg: `<svg viewBox="0 0 400 150" class="w-full h-full"><rect width="100%" height="100%" fill="#180e29"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#d8b4fe" font-size="14" font-weight="bold">MAIN 3-M3: Painting a Better Tomorrow</text></svg>`,
              eng: "Minsu painted some flowers and Jiwon did some background drawings. Our club painted for about five hours. Minsu was very proud of his flower painting. He said, 'My flower is so real that a bee landed on it.' I said, 'Drawing on a wall was much harder than drawing on paper.' We all agreed (that) our wall painting wasn't perfect. But it didn't matter. We made our neighborhood a little brighter and happier. We were proud of ourselves. It was a better tomorrow that we painted.", 
              kor: "민수는 약간의 꽃들을 그렸습니다. 그리고 지원이는 배경 그림들을 좀 그렸습니다. 우리 동아리는 약 5시간 동안 그렸습니다. 민수는 그의 꽃 그림에 대해 매우 자랑스러워했습니다. He said, 'My flower is so real that a bee landed on it.' I said, 'Drawing on a wall was much harder than drawing on paper.' We all agreed (that) our wall painting wasn't perfect. But it didn't matter. We made our neighborhood a little brighter and happier. We were proud of ourselves. It was a better tomorrow that we painted.", 
              tip: "<b>so real that</b>: 소댓 원인-결과 구조식. <b>much harder</b>: 비교급 강조 수식 부사 much 연동. <b>proud of ourselves</b>: 재귀대명사 목적어 규칙 적중. <b>It was ~ that 강조구문</b> 발현 완료." }
        ];

        // ==================== [제4과 대화문 및 본문 구조화] ====================
        appData[4].dialog = [
            { svg: `<svg viewBox="0 0 400 150" class="w-full h-full"><rect width="100%" height="100%" fill="#0f172a"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="bold">SCENE 4-D1: Transit Subway in Korea</text></svg>`,
              eng: "B: Hi, Amy. Welcome to Korea. G: Long time no see, Minho. How have you been? B: Great. How did you come here from the airport? G: I came here by subway. B: How do you feel about the subway in Korea? G: I think (that) it's very clean.", 
              kor: "남: 안녕, 에이미. 한국에 온 것을 환영해. 여: 오랜 만이야, 민호야. 그동안 어떻게 지냈니? 남: 잘 지냈어. 너는 공항에서 여기로 어떻게 왔니? 여: 나는 지하철로 여기에 왔어. 남: 너는 한국의 지하철에 대해 어떻게 생각하니? 여: 나는 그것이 매우 깨끗하다고 생각해.", 
              tip: "<b>How have you been?</b>: 현재완료 시제 활용 안부 표현. <b>by subway</b>: 무관사 교통수단 전치사 매칭 확인." },
            { svg: `<svg viewBox="0 0 400 150" class="w-full h-full"><rect width="100%" height="100%" fill="#1e1b4b"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#a5b4fc" font-size="14" font-weight="bold">SCENE 4-D2: Hidden Danger of Energy Drinks</text></svg>`,
              eng: "B: Hey, Jessica. Why are you always drinking energy drinks? G: (Because) they help me stay awake. B: I'm with you on that, but they have too much caffeine. G: Well, they help me focus on my studies. B: Did you know (that) too much caffeine can hurt your bones? G: Oh, I didn't know that. B: I think (that) you should drink energy drinks less often. G: Maybe you're right. Thanks, Tom.", 
              kor: "남: 이봐, 제시카. 너는 왜 항상 에너지 드링크를 마시고 있니? 여: 왜냐하면 그것들이 나를 깨어있도록 돕기 때문이야. 남: 나는 그것에 대해 너와 동의해, 하지만 그것들은 카페인이 너무 많아. 여: 음, 그것들이 내가 내 공부에 집중할 수 있도록 도와줘. 남: 너는 너무 많은 카페인이 네 뼈를 해칠 수 있다는 것을 알고 있었니? 여: 아, 나는 그것을 몰랐어. 남: 나는 네가 에너지 드링크를 덜 자주 마셔야한다고 생각해. 여: 아마도 네가 맞아. 고마워, 톰.", 
              tip: "<b>help me stay awake</b>: 준사역 보어 원형 매칭 룰 가동 및 서술 형용사 awake 결합. <b>I'm with you on that</b>: 의견 합치 구어 표현." }
        ];

        appData[4].main = [
            { svg: `<svg viewBox="0 0 400 150" class="w-full h-full"><rect width="100%" height="100%" fill="#451a03"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#fed7aa" font-size="14" font-weight="bold">MAIN 4-M1: Camp Green Lake Digging</text></svg>`,
              eng: "'Dig harder, Stanley! The harder you dig, the faster you'll finish!' yelled Mr. Sir. Stanley Yelnats couldn't dig any harder since every single muscle hurt. He was thirsty and hungry. He wanted to go home. Unfortunately Stanley's home for the next 18 months would be right here, at Camp Green Lake. Camp Green Lake was a terrible name. It wasn't green and there was no lake.", 
              kor: "'더 세게 파, 스탠리! 네가 더 세게 파면 팔수록, 너는 더 빠르게 끝낼 거야!' 미스터 써가 외쳤습니다. 스탠리 옐낫츠는 모든 근육이 아팠기 때문에 더 세게 팔수는 없었습니다. 그는 목마르고 배가 고팠습니다. 그는 집에 가길 원했습니다. 불행히도 다음 18개월 동안의 스탠리의 집은 이곳, 캠프 그린 레이크일 것입니다. 캠프 그린 레이크는 끔찍한 이름이었습니다. 그것은 푸르지도 않았고 호수도 없었습니다.", 
              tip: "<b>The harder ~, the faster ~</b>: 고출력 서술형 핵심 비례 도치 구문. <b>since</b>: 주절에 현재완료 사슬이 비연동 상태이므로 이유 용법의 원인 부사절 접속사 유도 기능 작동." },
            { svg: `<svg viewBox="0 0 400 150" class="w-full h-full"><rect width="100%" height="100%" fill="#172554"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#bfdbfe" font-size="14" font-weight="bold">MAIN 4-M2: Discovery of the Gold Tube</text></svg>`,
              eng: "Each boy had to dig one hole every day. It had to be about 150cm deep and 150cm wide. In his second week, as Stanley was finishing his hole, he saw something shiny in the dirt. Stanley's heart beat faster. He heard (that) anyone who found something interesting would be given the day off. He carefully picked up the shiny object and brushed off the dirt. It was a small gold tube. But it couldn't be real gold since it was too light. There were two letters, KB, at the bottom of the tube. What did KB stand for? Stanley's heart beat even faster.", 
              kor: "각각의 소년들은 매일 하나의 구멍을 파야 했습니다. 그것은 약 150센티 깊이와 150센티 폭이 되어야 했습니다. 그의 두 번째 주에, 스탠리가 그의 구멍을 파고 있었을 때, 그는 흙 속에서 반짝이는 무언가를 보았습니다. 스탠리의 심장은 더 빠르게 뛰었습니다. 그는 흥미로운 어떤 것을 발견하는 누구라도 쉬는 날을 얻게 될 것이라는 것을 들었습니다. 그는 그 빛나는 물체를 주의 깊게 들어 올려서 흙을 털어냈습니다. 그것은 작은 금색 관이었습니다. 그러나 그것이 너무 가볍기 때문에 그것은 진짜 금 일리 없습니다. 관의 바닥엔 두 글자 KB가 있었습니다. KB가 무엇을 상징했을까요? 스탠리의 심장은 훨씬 더 빠르게 뛰었습니다.", 
              tip: "<b>something shiny / interesting</b>: 형용사 후치 수식 대상 한정 연동 규칙 가동. <b>couldn't be</b>: 강력 부인 단정 추측 (~일 리가 없다). <b>even faster</b>: 비교급 강조 매칭." }
        ];

        // ==================== [웹 애플리케이션 코어 제어 엔진 모델] ====================
        let currentLesson = "3";
        let currentTab = "vocab";
        let vocabIndex = 0;
        let subTextTab = "dialog";

        function updateVocabCard() {
            const list = appData[currentLesson].vocab;
            const item = list[vocabIndex];
            
            // 카드 뒤집기 클래스 상태 초기화
            document.getElementById("flashcard").classList.remove("flipped");
            
            setTimeout(() => {
                document.getElementById("vocab-word").innerText = item.word;
                document.getElementById("vocab-pron").innerText = item.pron;
                document.getElementById("vocab-meaning").innerText = item.meaning;
                document.getElementById("vocab-syn").innerText = item.syn;
                document.getElementById("vocab-etym").innerText = item.etym;
                
                const engDefContainer = document.getElementById("eng-def-container");
                if (item.eng && item.eng.trim() !== "") {
                    engDefContainer.style.display = "block";
                    document.getElementById("vocab-eng").innerText = item.eng;
                    document.getElementById("vocab-engkor").innerText = "👉 해석: " + item.engKor;
                } else {
                    engDefContainer.style.display = "none";
                }
                
                document.getElementById("vocab-index").innerText = `${vocabIndex + 1} / ${list.length}`;
            }, 120);
        }

        function flipCard() {
            document.getElementById("flashcard").classList.toggle("flipped");
        }

        function nextVocab() {
            vocabIndex = (vocabIndex + 1) % appData[currentLesson].vocab.length;
            updateVocabCard();
        }

        function prevVocab() {
            const len = appData[currentLesson].vocab.length;
            vocabIndex = (vocabIndex - 1 + len) % len;
            updateVocabCard();
        }

        function renderGrammar() {
            const container = document.getElementById("grammar-content");
            container.innerHTML = "";
            appData[currentLesson].grammar.forEach(g => {
                const card = document.createElement("div");
                card.className = "bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md space-y-2";
                card.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="w-1.5 h-4 bg-indigo-500 rounded-full"></span>
                        <h3 class="text-xs font-black text-indigo-400 tracking-tight">${g.title}</h3>
                    </div>
                    <p class="text-xs text-slate-300 bg-slate-950 p-2.5 rounded border border-slate-700/50 leading-relaxed">${g.desc}</p>
                    <div class="text-[11px] text-emerald-400 font-mono pt-1 leading-normal bg-slate-950/60 p-3 rounded-xl border border-slate-900">${g.ex}</div>
                `;
                container.appendChild(card);
            });
        }

        function renderText() {
            const container = document.getElementById("text-container");
            container.innerHTML = "";
            const list = appData[currentLesson][subTextTab];

            list.forEach((t, i) => {
                const card = document.createElement("div");
                card.className = "bg-slate-800 rounded-lg border border-slate-700 overflow-hidden shadow-sm";
                
                let imageHtml = "";
                if (t.svg) {
                    imageHtml = `<div class="w-full aspect-[21/9] bg-slate-950">${t.svg}</div>`;
                }

                card.innerHTML = `
                    ${imageHtml}
                    <div onclick="toggleText(${i})" class="p-3.5 active:bg-slate-700/50 transition-colors cursor-pointer flex justify-between items-start gap-2">
                        <p class="text-xs font-bold text-slate-200 font-mono tracking-tight leading-relaxed pr-2">${t.eng}</p>
                        <span class="text-slate-500 text-[10px] mt-1 shrink-0">▼</span>
                    </div>
                    <div id="text-box-${i}" class="hidden bg-slate-950 px-4 pb-4 pt-2 border-t border-slate-700/60 space-y-2 animate-fadeIn">
                        <div class="space-y-0.5">
                            <span class="text-[9px] font-black tracking-widest text-indigo-400 block">KOREAN TRANSLATION</span>
                            <p class="text-xs font-black text-slate-100">${t.kor}</p>
                        </div>
                        <div class="space-y-1 bg-slate-900/60 p-2.5 rounded-xl border border-slate-900">
                            <span class="text-[9px] font-black tracking-widest text-emerald-400 block">ZEBRA GRAMMAR ANALYSIS</span>
                            <p class="text-[11px] text-slate-400 leading-relaxed font-medium">${t.tip}</p>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleText(idx) {
            document.getElementById(`text-box-${idx}`).classList.toggle("hidden");
        }

        function switchTab(tab) {
            currentTab = tab;
            ['vocab', 'grammar', 'text'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                const sec = document.getElementById(`section-${t}`);
                if (t === tab) {
                    btn.className = "w-full py-4 text-center border-b-2 border-indigo-500 text-indigo-400 transition-all duration-200";
                    sec.className = "block space-y-4";
                } else {
                    btn.className = "w-full py-4 text-center border-b-2 border-transparent text-slate-400 transition-all duration-200";
                    sec.className = "hidden";
                }
            });
            if(tab === 'grammar') renderGrammar();
            if(tab === 'text') renderText();
        }

        function switchSubText(sub) {
            subTextTab = sub;
            const dBtn = document.getElementById("btn-subtext-dialog");
            const mBtn = document.getElementById("btn-subtext-main");
            if(sub === 'dialog') {
                dBtn.className = "w-full py-2.5 rounded-lg text-center text-xs font-black bg-slate-800 text-indigo-400 shadow-md transition-all";
                mBtn.className = "w-full py-2.5 rounded-lg text-center text-xs font-black text-slate-400 transition-all";
            } else {
                mBtn.className = "w-full py-2.5 rounded-lg text-center text-xs font-black bg-slate-800 text-indigo-400 shadow-md transition-all";
                dBtn.className = "w-full py-2.5 rounded-lg text-center text-xs font-black text-slate-400 transition-all";
            }
            renderText();
        }

        function switchLesson() {
            currentLesson = document.getElementById("lessonSelector").value;
            vocabIndex = 0;
            updateVocabCard();
            if(currentTab === 'grammar') renderGrammar();
            if(currentTab === 'text') renderText();
        }

        window.onload = function() {
            updateVocabCard();
        }
    </script>
</body>
</html>
