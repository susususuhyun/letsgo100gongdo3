        function updateVocabCard() {
            const list = appData[currentLesson].vocab;
            const item = list[vocabIndex];
            document.getElementById("flashcard").classList.remove("flipped");
            
            setTimeout(() => {
                document.getElementById("vocab-word").innerText = item.word;
                document.getElementById("vocab-pron").innerText = item.pron;
                document.getElementById("vocab-meaning").innerText = item.meaning;
                document.getElementById("vocab-syn").innerText = item.syn;
                document.getElementById("vocab-etym").innerText = item.etym;
                
                const engDefContainer = document.getElementById("eng-def-container");
                if (item.eng && item.eng.trim() !== "") {
                    engDefContainer.style.display = "block";
                    document.getElementById("vocab-eng").innerText = item.eng;
                } else {
                    engDefContainer.style.display = "none";
                }
                
                document.getElementById("vocab-index").innerText = `${vocabIndex + 1} / ${list.length}`;
            }, 120);
        }

        function flipCard() {
            document.getElementById("flashcard").classList.toggle("flipped");
        }

        function nextVocab() {
            vocabIndex = (vocabIndex + 1) % appData[currentLesson].vocab.length;
            updateVocabCard();
        }

        function prevVocab() {
            const len = appData[currentLesson].vocab.length;
            vocabIndex = (vocabIndex - 1 + len) % len;
            updateVocabCard();

            const container = document.getElementById("grammar-content");

            appData[currentLesson].grammar.forEach(g => {
                const card = document.createElement("div");
                card.className = "bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md space-y-2";
                card.innerHTML = `
                    <h3 class="text-xs font-black text-indigo-400">${g.title}</h3>
                    <p class="text-xs text-slate-300 bg-slate-900/60 p-2.5 rounded border border-slate-700/50 leading-relaxed">${g.desc}</p>
                    <div class="text-[11px] text-emerald-400 font-mono pt-1 leading-normal">${g.ex}</div>
                `;
                container.appendChild(card);
            });
        }

        function renderText() {
            const container = document.getElementById("text-container");
            container.innerHTML = "";
            const list = appData[currentLesson][subTextTab];

            list.forEach((t, i) => {
                const card = document.createElement("div");
                card.className = "bg-slate-800 rounded-lg border border-slate-700 overflow-hidden shadow-sm";
                
                // 이미지 깨짐 버그 완벽 수정: placehold.co 고해상도 그래픽 서비스로 안전 장치 바인딩
                let imageHtml = "";
                if (t.imgText) {
                    imageHtml = `<img src="https://placehold.co/600x320/312e81/f8fafc?text=${t.imgText}" alt="${t.imgText}" class="w-full h-auto object-cover border-b border-slate-700">`;
                }

                card.innerHTML = `
                    ${imageHtml}
                    <div onclick="toggleText(${i})" class="p-3 active:bg-slate-700/50 transition-colors cursor-pointer flex justify-between items-start gap-2">
                        <p class="text-xs font-semibold text-slate-200 font-mono tracking-tight leading-normal">${t.eng}</p>
                        <span class="text-slate-500 text-[10px] mt-0.5">▼</span>
                    </div>
                    <div id="text-box-${i}" class="hidden bg-slate-900/80 px-3 pb-3 pt-1.5 border-t border-slate-700/60 space-y-1.5 animate-fadeIn">
                        <p class="text-xs font-bold text-indigo-400">🇰🇷 해석: ${t.kor}</p>
                        <p class="text-[11px] text-slate-400 border-l-2 border-slate-600 pl-2 leading-relaxed">${t.tip}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

            document.getElementById(`text-box-${idx}`).classList.toggle("hidden");
        }

        function switchTab(tab) {
            currentTab = tab;
            ['vocab', 'grammar', 'text'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                const sec = document.getElementById(`section-${t}`);
                if (t === tab) {
                    btn.className = "w-full py-3.5 text-center border-b-2 border-indigo-500 text-indigo-400 transition-colors";
                    sec.className = "block space-y-4";
                } else {
                    btn.className = "w-full py-3.5 text-center border-b-2 border-transparent text-slate-400 transition-colors";
                    sec.className = "hidden";
                }
            });
            if(tab === 'grammar') renderGrammar();
            if(tab === 'text') renderText();
        }

            subTextTab = sub;

            if(sub === 'dialog') {
                dBtn.className = "w-full py-2 rounded-md text-center bg-slate-700 text-indigo-400 shadow-sm";

            }
            renderText();
        }
